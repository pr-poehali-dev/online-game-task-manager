# Превью ссылки на задачу (forge.la2era.com/task/141) в Telegram/WhatsApp/VK и т.п.: их боты
# не выполняют JS и не входят в аккаунт, поэтому обычный SPA index.html показывал бы одну и ту
# же статичную карточку "ЭРА" для любой ссылки на любую задачу. $is_bot_ua распознаёт бота по
# User-Agent — ТОЛЬКО ему location /task/ ниже отдаёт готовый HTML с номером и названием
# конкретной задачи (см. deploy/server.py, /api/_og/task/{id}); обычный браузер сотрудника эту
# ветку не видит вообще и получает SPA как раньше. map — директива уровня http, поэтому лежит
# здесь, до первого server{} (sites-enabled/* уже подключены внутри http{} в главном nginx.conf).
map $http_user_agent $is_bot_ua {
    default 0;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*facebookexternalhit 1;
    ~*vkshare 1;
    ~*discordbot 1;
    ~*slackbot 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*skypeuripreview 1;
    ~*viber 1;
}

server {
    listen 80;
    server_name forge.la2era.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name forge.la2era.com;

    ssl_certificate /etc/letsencrypt/live/forge.la2era.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.la2era.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/era/dist;
    index index.html;

    # Ссылка на задачу: боту-краулеру (see map $is_bot_ua выше) отдаём готовый HTML с номером
    # и названием задачи через backend, обычному браузеру — тот же SPA-фолбэк, что ниже в
    # location / (try_files здесь обязателен: без него location с regex НЕ наследует try_files
    # из location /, и обычный пользователь получил бы 404 вместо приложения).
    location ~ ^/task/(\d+)$ {
        # proxy_set_header вынесен из блока if на уровень location: Nginx не разрешает эту
        # директиву внутри if (директива применяется всегда, но проксирование реально уходит
        # только если сработал if ниже — на обычный SPA-фолбэк try_files она не влияет).
        proxy_set_header Host $host;
        if ($is_bot_ua = 1) {
            proxy_pass http://127.0.0.1:8000/api/_og/task/$1;
            break;
        }
        try_files /index.html /index.html;
    }

    # ВАЖНО: выше location /
    location ^~ /files/ {
        proxy_pass http://193.107.203.136:9000/files/;
        proxy_set_header Host $proxy_host;  # лучше чем $host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Token $http_x_auth_token;

        client_max_body_size 420M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 20M;
}
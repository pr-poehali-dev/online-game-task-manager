# Конфиг Nginx для ERA Task Manager — настроен под боевой домен forge.la2era.com.
# Скопируйте в /etc/nginx/sites-available/era поверх текущего файла на сервере,
# затем: sudo nginx -t && sudo systemctl reload nginx
# Если SSL (certbot) ещё не подключён: sudo certbot --nginx -d forge.la2era.com
# (certbot сам допишет блок listen 443 ssl — этот файл его не трогает и не заменяет)

# Превью ссылки на задачу (forge.la2era.com/task/141) в Telegram/WhatsApp/VK и т.п.: их боты
# не выполняют JS и не входят в аккаунт, поэтому обычный SPA index.html показывал бы одну и ту
# же статичную карточку "ЭРА" для любой ссылки на любую задачу. $is_bot_ua распознаёт бота по
# User-Agent — ТОЛЬКО ему location /task/ ниже отдаёт готовый HTML с номером и названием
# конкретной задачи (см. deploy/server.py, /api/_og/task/{id}); обычный браузер сотрудника эту
# ветку не видит вообще и получает SPA как раньше. map — директива уровня http, поэтому лежит
# здесь, до server{} (sites-enabled/* уже подключены внутри http{} в главном nginx.conf).
map $http_user_agent $is_bot_ua {
    default 0;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*facebookexternalhit 1;
    ~*vkshare 1;
    ~*discordbot 1;
    ~*slackbot 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*skypeuripreview 1;
    ~*viber 1;
}

server {
    listen 80;
    server_name forge.la2era.com;

    # Статика фронтенда (результат npm run build)
    root /var/www/era/dist;
    index index.html;

    # Ссылка на задачу: боту-краулеру (see map $is_bot_ua выше) отдаём готовый HTML с номером
    # и названием задачи через FastAPI, обычному браузеру — тот же SPA-фолбэк, что ниже в
    # location / (try_files здесь обязателен: без него location с regex НЕ наследует try_files
    # из location /, и обычный пользователь получил бы 404 вместо приложения).
    location ~ ^/task/(\d+)$ {
        if ($is_bot_ua = 1) {
            proxy_pass http://127.0.0.1:8000/api/_og/task/$1;
            proxy_set_header Host $host;
            break;
        }
        try_files /index.html /index.html;
    }

    # Backend-функции: /api/tasks, /api/ideas и т.д. → на FastAPI (порт 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ВАЖНО: пробрасываем кастомный заголовок авторизации
        proxy_set_header X-Auth-Token $http_x_auth_token;

        # Вложения к задачам/идеям/статьям передаются как base64 в JSON — это увеличивает
        # размер файла примерно на 33%. Лимит здесь и таймаут должны быть согласованы
        # с MAX_FILE_SIZE (300 МБ) в backend/*/index.py, иначе большие (но разрешённые
        # кодом) файлы будут обрываться прямо на Nginx с ошибкой "413 Payload Too Large"
        # ещё до того, как запрос дойдёт до Python.
        client_max_body_size 420M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA: любой неизвестный путь отдаёт index.html (для React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш для статики
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Общий лимит на тело запроса для всего сайта (на случай запросов вне /api/)
    client_max_body_size 20M;
}
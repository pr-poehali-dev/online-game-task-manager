# Копия deploy/nginx.conf под структуру ИМЕННО вашего боевого сервера forge.la2era.com —
# на диске сервера лежит по пути /etc/nginx/sites-available/forge.la2era.com (не sites-available/era,
# как в общем шаблоне: у вас SSL от certbot и свой location /files/ на отдельный сервер MinIO,
# общий шаблон deploy/nginx.conf под эту структуру не подходит без правок — см. update/NOTES_FOR_ME.md).
#
# Единственное отличие от версии, которая сейчас стоит у вас на сервере, — добавлен блок
# location /api/ai/stream (см. ниже) для патча update/2026-09-19 (честный стриминг ответа ИИ).
# Всё остальное — 1-в-1 то, что вы прислали, без изменений.

map $http_user_agent $is_bot_ua {
    default 0;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*facebookexternalhit 1;
    ~*vkshare 1;
    ~*discordbot 1;
    ~*slackbot 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*skypeuripreview 1;
    ~*viber 1;
}

server {
    listen 80;
    server_name forge.la2era.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name forge.la2era.com;

    ssl_certificate /etc/letsencrypt/live/forge.la2era.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.la2era.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/era/dist;
    index index.html;

    # Ссылка на задачу: боту-краулеру (see map $is_bot_ua выше) отдаём готовый HTML с номером
    # и названием задачи через backend, обычному браузеру — тот же SPA-фолбэк, что ниже в
    # location / (try_files здесь обязателен: без него location с regex НЕ наследует try_files
    # из location /, и обычный пользователь получил бы 404 вместо приложения).
    location ~ ^/task/(\d+)$ {
        if ($is_bot_ua = 1) {
            rewrite ^/task/(\d+)$ /__og_task/$1 last;
        }
        try_files /index.html /index.html;
    }

    # internal — недоступен напрямую снаружи, только через rewrite выше.
    location ~ ^/__og_task/(\d+)$ {
        internal;
        proxy_pass http://127.0.0.1:8000/api/_og/task/$1;
        proxy_set_header Host $host;
    }

    # ВАЖНО: выше location /
    location ^~ /files/ {
        proxy_pass http://193.107.203.136:9000/files/;
        proxy_set_header Host $proxy_host;  # лучше чем $host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # НОВОЕ (update/2026-09-19): потоковый (SSE) ответ обычного чата раздела "AI" — см.
    # deploy/server.py, /api/ai/stream. ВАЖНО: этот location должен идти ДО общего /api/ ниже
    # (Nginx матчит по самому длинному совпавшему префиксу, но эта директива задаёт СВОИ значения
    # proxy_buffering — раздельные location надёжнее, чем полагаться на порядок объявления).
    # proxy_buffering off — без него Nginx буферизует весь ответ и отдаёт браузеру одним куском,
    # СВОДЯ НА НЕТ смысл SSE-стрима (сотрудник увидел бы тот же эффект "ждём и получаем всё сразу",
    # что и без стриминга). Если этот блок не добавить — ничего не сломается, фронт сам обнаружит
    # 404 на /api/ai/stream и молча откатится на обычный запрос (см. useAiSection.ts).
    location /api/ai/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Token $http_x_auth_token;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Token $http_x_auth_token;

        client_max_body_size 420M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 20M;
}
